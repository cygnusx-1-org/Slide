plugins {
    id 'com.android.application'
    id 'com.gladed.androidgitversion' version '0.4.14'
    id 'com.github.ben-manes.versions' version '0.54.0'
    id 'com.github.breadmoirai.github-release' version '2.5.2'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'io.github.takahirom.roborazzi' version '1.64.0'
    id 'net.ltgt.errorprone' version '5.1.0'
    id 'jacoco'
}

jacoco {
    // 0.8.13+ is required to read Java 24 (class-file major 68) bytecode.
    toolVersion = '0.8.15'
}

android {
    compileSdk 37
    namespace = "me.edgan.redditslide"

    // APK/AAB custom names are applied via the new Variant API (androidComponents block at the end
    // of this file). AGP 9's new DSL removed applicationVariants.outputs.outputFileName.

    defaultConfig {
        applicationId "me.edgan.redditslide"
        minSdk 29
        targetSdk 36
        versionCode 786
        versionName androidGitVersion.name()
    }

    flavorDimensions "variant"
    productFlavors {
        withGPlay {
            dimension "variant"
            buildConfigField "boolean", "isFDroid", "false"
        }
        noGPlay {
            dimension "variant"
            buildConfigField "boolean", "isFDroid", "true"
        }
    }

    def keystorePropertiesFile = rootProject.file("keystore.properties")

    if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

        signingConfigs {
            withGPlay {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    } else {
        println("Warning: keystore.properties file not found. Skipping signing configuration for withGPlay.")
    }


    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.withGPlay
            } else {
                println("Warning: keystore.properties file not found. Skipping signing configuration for release.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Slide"
        }
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "Slide Debug"
        }
    }

    packaging {
        resources {
            excludes += 'META-INF/*'
        }
    }

    compileOptions {
        encoding = "UTF-8"
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }

    lint {
        // Lint errors are kept at zero; fail the build if a new one is introduced.
        // Warnings do not abort (see the large existing warning backlog).
        abortOnError = true
        // Translations are crowd-sourced. ImpliedQuantity fires on the count-less
        // abbreviation plurals (points -> "pt"/"pts", comments -> "cmt"/"cmts")
        // whose quantity is rendered separately, so no %d belongs in the string;
        // this is inherent to Slavic/Romance plural rules and recurs per locale.
        disable 'MissingTranslation', 'ExtraTranslation', 'ImpliedQuantity',
                'StaticFieldLeak', 'ClickableViewAccessibility', 'NotSibling'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Gradle defaults the test JVM to 512m, which the Roborazzi goldens outgrew: at the
                // widest configuration a row is ~2800px across and MaxHeightImageView lets an image
                // reach 3200px tall, so a single ARGB_8888 capture is ~36 MB before Roborazzi's own
                // copy of it. Raising this rather than dropping the wide cases, since the widest
                // layout is the one most worth a golden.
                maxHeapSize = '2g'
                jvmArgs = [
                    '-Xshare:off',
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.regex=ALL-UNNAMED'
                ]
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
        // Required because build types use resValue (release/debug app_name); the global
        // android.defaults.buildfeatures.resvalues default is off in AGP 9.
        resValues = true
    }
}

// JaCoCo line/branch coverage for the default (withGPlayDebug) unit-test variant.
// Run: ./gradlew jacocoWithGPlayDebugUnitTestReport ; report at
// app/build/reports/jacoco/jacocoWithGPlayDebugUnitTestReport/html/index.html
tasks.register('jacocoWithGPlayDebugUnitTestReport', JacocoReport) {
    dependsOn 'testWithGPlayDebugUnitTest'
    group = 'verification'
    description = 'Generates JaCoCo coverage from the withGPlayDebug unit tests.'

    def coverageExcludes = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        '**/*Test*.*', '**/databinding/**', '**/*_ViewBinding*.*',
        '**/*Binding.*', '**/*Binding$*.*', 'android/**/*.*'
    ]

    // JaCoCo resolves package names from the class bytes, so rooting at the variant's javac output
    // and collecting every .class works regardless of the intermediate directory layout. Paths are
    // wrapped lazily (providers) so nothing is resolved at configuration time.
    classDirectories.setFrom(
        layout.buildDirectory.dir('intermediates/javac/withGPlayDebug').map { dir ->
            fileTree(dir: dir.asFile, excludes: coverageExcludes)
        })
    sourceDirectories.setFrom(files(['src/main/java']))
    // AGP writes the unit-test coverage data under these two locations; scope to them rather than
    // scanning the whole build directory.
    executionData.setFrom(
        layout.buildDirectory.map { buildDir ->
            fileTree(dir: buildDir.asFile, includes: [
                'outputs/unit_test_code_coverage/withGPlayDebugUnitTest/testWithGPlayDebugUnitTest.exec',
                'jacoco/testWithGPlayDebugUnitTest.exec'
            ])
        })

    reports {
        xml.required = true
        html.required = true
    }
}

configurations {
    all {
        exclude module: 'httpclient'
    }
}

// net.ltgt.errorprone has no Android Gradle Plugin support: it creates the errorprone
// configuration but wires it to nothing, and leaves the options.errorprone extension disabled.
// Every variant's <variant>AnnotationProcessor extends annotationProcessor, so this one line puts
// Error Prone on the processor path for all four variants.
configurations.named('annotationProcessor') { extendsFrom configurations.errorprone }
// Same for unit tests: every variant's <variant>UnitTestAnnotationProcessor extends
// testAnnotationProcessor. See NULLAWAY.md phase 7.
configurations.named('testAnnotationProcessor') { extendsFrom configurations.errorprone }

// NullAway rollout, phase 0. Only code marked @NullMarked is analyzed, so this is a no-op until
// the first package-info.java lands. See NULLAWAY.md.
tasks.withType(JavaCompile).configureEach { task ->
    // Error Prone is on the annotationProcessor and testAnnotationProcessor paths only. Any other
    // test component (androidTest, test fixtures) extends neither, so it must stay disabled there
    // or javac fails outright with "plug-in not found: ErrorProne".
    boolean isUnitTest = task.name.contains('UnitTest')
    boolean isOtherTest = !isUnitTest && task.name.contains('Test')
    options.errorprone {
        enabled = !isOtherTest
        // NullAway only. Error Prone's other checks have never run against this codebase;
        // adopting them is NULLAWAY.md phase 9, with its own cleanup budget. Disabling them
        // explicitly also pins behaviour: a future Error Prone release cannot add a check that
        // breaks the build.
        disableAllChecks = true
        check('NullAway', CheckSeverity.ERROR)
        // Error Prone's own checks, named one by one rather than by dropping disableAllChecks.
        // That keeps the phase 0 pinning rationale: a future Error Prone release cannot add a
        // check that breaks this build. Three of the thirteen NULLAWAY.md phase 9 proposed are
        // deliberately absent — ReferenceEquality, MissingCasesInEnumSwitch and StringSplitter —
        // see that phase for the measurements behind each.
        ['ComplexBooleanConstant', 'DoubleBraceInitialization', 'EmptyCatch', 'EqualsHashCode',
         'IdentityBinaryExpression', 'MissingOverride', 'NarrowingCompoundAssignment',
         'OperatorPrecedence', 'StringCaseLocaleUsage', 'UnusedVariable'].each {
            check(it, CheckSeverity.ERROR)
        }
        // dataBinding and viewBinding are enabled, so generated *Binding classes, R, and
        // BuildConfig compile in the same javac invocation.
        excludedPaths = '.*/build/generated/.*'
        option('NullAway:OnlyNullMarked', 'true')
        // Checks array components, which is the half of it this codebase can use. Its generics
        // checking needs TYPE_USE annotations *and* a @NullMarked generic class, and phase 16
        // measured that the second requirement is the binding one: a type argument written on an
        // unannotated generic is accepted and then ignored, so List<@Nullable X> costs
        // assignment-compatibility churn at every override and buys no dereference checking at
        // all. The generics this app instantiates are java.util.*, so that half stays inert
        // whatever annotation dialect the 289 files use. The four generic classes declared
        // in-tree ARE checked, and would need `T extends @Nullable Object` to accept a nullable
        // type argument at all. See NULLAWAY.md phases 7 and 16.
        option('NullAway:JSpecifyMode', 'true')
        // Honor @Nullable found on unannotated third-party code: getIntent().getExtras() and
        // Intent.getAction() are caught this way, and so is most of androidx —
        // Fragment.getTag(), getView(), getParentFragment() and getHost() all fire.
        option('NullAway:AcknowledgeRestrictiveAnnotations', 'true')
        // NullAway ships DefaultLibraryModels.NONNULL_RETURNS, which declares a handful of
        // pervasive Android accessors non-null and so overrides both the option above and any
        // model of ours. That, not "androidx is out of reach", is why phases 0, 7 and 8 could not
        // reach Fragment.getActivity()/getContext(). Dropping the two entries makes their real
        // androidx @Nullable visible and put 285 call sites under the checker; see NULLAWAY.md
        // phase 14.
        //
        // The key is class + bare method name. A signature ("getActivity()") silently matches
        // nothing, which is how this option first read as broken.
        //
        // findViewById is deliberately NOT listed. Activity.findViewById and View.findViewById
        // carry no nullability annotation at all — AOSP says so in a source comment — so skipping
        // their model changes nothing. Those sites are source changes or nothing.
        //
        // Everything phase 14 measured and left for later is now listed too, so the whole of
        // NONNULL_RETURNS that this codebase actually calls is dropped rather than half of it.
        // Re-measured rather than trusted, and both numbers had moved: getArguments cost 22
        // findings (the phase predicted 23) and ContextCompat.getDrawable cost 2 where the phase
        // measured zero. The four that really are free are listed anyway — the entry is what
        // stops a future call site being waved through. See NULLAWAY.md phase 14.
        //
        // Fragment.onCreateView is deliberately NOT listed: the model constrains what an override
        // may return, and returning null from onCreateView is legal and used here.
        option('NullAway:IgnoreLibraryModelsFor',
                'androidx.fragment.app.Fragment.getActivity'
                        + ',androidx.fragment.app.Fragment.getContext'
                        + ',androidx.fragment.app.Fragment.getArguments'
                        + ',android.view.ViewGroup.getChildAt'
                        + ',android.view.View.getResources'
                        + ',android.content.res.Resources.getDrawable'
                        + ',androidx.core.content.ContextCompat.getDrawable'
                        + ',androidx.appcompat.content.res.AppCompatResources.getDrawable'
                        + ',android.support.design.widget.TextInputLayout.getEditText')
        // Read assertNotNull(x) / assertThat(x).isNotNull() as null checks. Only meaningful in
        // the unit-test compiles, but harmless in the others.
        option('NullAway:HandleTestAssertionLibraries', 'true')
    }
    // Error Prone forces a forked javac on JDK 16+; this box has no swap, so cap the child JVM.
    // javac defaults both of these to 100 and truncates silently. Two NULLAWAY.md phases were
    // planned from a count that had been capped at exactly 100 (phase 9 from warnings, phase 12
    // from errors), so raise them here rather than remembering to do it while measuring. This is a
    // javac option, not an Error Prone one: it belongs in compilerArgs, and errorproneArgs is
    // silently ignored for it.
    options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-Xmaxwarns', '1000'])
    options.forkOptions.memoryMaximumSize = '2g'
}

def githubPropertiesFile = rootProject.file("github.properties")

if (githubPropertiesFile.exists()) {
    def githubProperties = new Properties()
    githubProperties.load(new FileInputStream(githubPropertiesFile))

    githubRelease {
        def releaseNotesProvider = providers.gradleProperty("releaseNotes")
            .orElse(providers.environmentVariable("RELEASE_NOTES"))
        def releaseNotes = releaseNotesProvider.getOrElse("")

        token = githubProperties["githubToken"]
        owner = "edgan"
        repo = "Slide"
        tagName = android.defaultConfig.versionName ?: "default-version"
        targetCommitish = "master"
        releaseName = "Release ${android.defaultConfig.versionName ?: "default-version"}"
        body = "$releaseNotes"
        draft = false
        prerelease = false
        overwrite = false

        // Dynamically set releaseAssets by searching the APK path
        def apkFiles = fileTree(dir: "build/outputs/apk/withGPlay/release/", include: "*.apk").files.toList()
        if (apkFiles.isEmpty()) {
            println("Warning: No APK files found in the directory 'build/outputs/apk/withGPlay/release/'.")
        } else {
            releaseAssets = apkFiles
        }
    }

    tasks.matching { it.name == "githubRelease" }.configureEach {
        doFirst {
            def releaseNotes = providers.gradleProperty("releaseNotes")
                .orElse(providers.environmentVariable("RELEASE_NOTES"))
                .getOrElse("")
            if (releaseNotes.trim().isEmpty()) {
                throw new GradleException(
                    "Release notes are required. Pass -PreleaseNotes or set RELEASE_NOTES."
                )
            }
        }
    }
} else {
    println("Warning: github.properties file not found. Skipping GitHub release configuration.")
}

dependencies {
/** Flavors **/
    // For Google Sign-In
    withGPlayImplementation 'com.google.android.gms:play-services-auth:20.6.0'
    // For the REST API Client
    withGPlayImplementation 'com.google.http-client:google-http-client:2.1.0'
    withGPlayImplementation 'com.google.api-client:google-api-client-android:2.7.1'
    withGPlayImplementation 'com.google.api-client:google-api-client-gson:2.7.1'
    withGPlayImplementation 'com.google.apis:google-api-services-drive:v3-rev20241206-2.0.0'

/** Custom **/
    implementation 'com.github.edgan:JRAW:40c5baef6b'

    // Stock commonmark 0.13.0 (Apache-2.0) — shared by Slide's richtext/editor code and
    // Markwon. Replaced the old Haptic-Apps fork (commonmark 0.5.0 + a one-line heading
    // tweak) so a single commonmark is on the classpath; see issue #179.
    def commonmarkVersion = '0.13.0'
    implementation "com.atlassian.commonmark:commonmark:$commonmarkVersion"
    implementation "com.atlassian.commonmark:commonmark-ext-gfm-strikethrough:$commonmarkVersion"
    implementation "com.atlassian.commonmark:commonmark-ext-gfm-tables:$commonmarkVersion"
    implementation 'com.github.Haptic-Apps:JReadability:bb291880a5'
    implementation 'com.github.edgan:Android-RobotoTextView:d368c94b3c'

    // Markwon (Apache-2.0) — Continuum-style markdown renderer (issue #179).
    // GPL-compatible library; Reddit-specific plugins are written clean-room in-tree.
    def markwonVersion = '4.6.2'
    implementation "io.noties.markwon:core:$markwonVersion"
    implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
    implementation "io.noties.markwon:ext-tables:$markwonVersion"
    implementation "io.noties.markwon:linkify:$markwonVersion"
    implementation "io.noties.markwon:inline-parser:$markwonVersion"

/** AndroidX **/
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation "androidx.concurrent:concurrent-futures:1.3.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.10.0"
    implementation "androidx.databinding:databinding-runtime:9.2.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
/** ExoPlayer **/
    // Application level media player
    implementation "androidx.media3:media3-exoplayer:1.10.1"
    implementation "androidx.media3:media3-ui:1.10.1"
    implementation "androidx.media3:media3-common:1.10.1"
    implementation("androidx.media3:media3-exoplayer-dash:1.10.1")
    implementation "androidx.media3:media3-datasource-okhttp:1.10.1"

/** Third-party **/
    // Good for debugging JRAW
    //implementation 'org.slf4j:slf4j-android:1.7.36'

    // QR code scanning
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

/**** Frontend (UI-related) ****/

    // Color picker (used by the in-app Draw screen)
    implementation 'com.github.skydoves:colorpickerview:2.3.0'

    // Snackbar engagement for rating
    implementation 'com.github.ligi.snackengage:snackengage-core:0.30'
    implementation 'com.github.ligi.snackengage:snackengage-playrate:0.30'

    // Image loading, caching, and displaying
    //  NOTE: Replace with Glide/Picasso
    // com.nostra13.universalimageloader:universal-image-loader
    implementation 'com.github.edgan:Android-Universal-Image-Loader:48cbc90782@aar'

    // Custom image view for photo galleries and large images
    implementation 'com.github.davemorrissey:subsampling-scale-image-view:173e421fdb'

    // Image cropping
    implementation 'com.vanniktech:android-image-cropper:4.7.0'

    // Blurring
    implementation 'com.github.wasabeef:Blurry:4.0.0'

    // Draggable sliding up panel

    // Floating action button menu implementation
    implementation 'com.nambimobile.widgets:expandable-fab:1.2.1'

    // RecyclerView animations
    implementation 'com.mikepenz:itemanimators:1.1.0@aar'

    // iOS-like over-scrolling effect
    implementation 'io.github.everythingme:overscroll-decor-android:1.1.1'

    // Library information
    implementation 'com.mikepenz:aboutlibraries:14.2.1'

/**** Backend logic ****/

    implementation 'androidx.documentfile:documentfile:1.1.0'

    // Core Java libraries from Google
    implementation 'com.google.guava:guava:33.6.0-android'

    // Application restarting
    implementation 'com.jakewharton:process-phoenix:3.0.0'

    // KV store based on SQLite
    //  equal to 0.1.0, but we can't use jcenter
    implementation 'com.github.lusfold:AndroidKeyValueStore:620c363'

    // Helper utilities for the java.lang API
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // Algorithms working on strings
    implementation 'org.apache.commons:commons-text:1.15.0'

    // Utilities to assist with developing IO functionality
    implementation 'commons-io:commons-io:2.22.0'


    // HTTP client
    // BOM aligns okhttp, okhttp-android, and the okhttp-urlconnection that JRAW
    // pulls transitively (JavaNetCookieJar) so they don't skew across major versions.
    implementation platform('com.squareup.okhttp3:okhttp-bom:5.4.0')
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection'

    // Convert Java objects into JSON and back
    implementation 'com.google.code.gson:gson:2.14.0'

    // Read, write, and create MP4 files
    implementation 'org.mp4parser:isoparser:1.9.56'
    implementation 'org.mp4parser:muxer:1.9.56'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.3'

/** Null checking **/
    // NullAway runs as an Error Prone plugin. See NULLAWAY.md for the rollout plan. Pin these
    // literally: a dynamic version could enable a new check and break the build at any time.
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.13.8'
    // Models the nullability of dependencies whose source we cannot change — Jackson, GSON and
    // Apache Commons. NULLAWAY.md phase 8. JRAW and UIL are our own forks, so they are annotated
    // at the source in phase 10 rather than modelled here; the module's staged JRAW entries are
    // not returned by nullableReturns() and so are inert.
    errorprone project(':nullaway-models')
    // Annotations only (~4 KB) and needed at compile time only. Used solely for @NullMarked;
    // nullable annotations stay on androidx.annotation.Nullable, which NullAway recognizes by
    // simple name.
    compileOnly 'org.jspecify:jspecify:1.0.1'
    testCompileOnly 'org.jspecify:jspecify:1.0.1'

/** Testing **/
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.hamcrest:hamcrest:3.0'

    // Roborazzi: render submission layouts at arbitrary smallest-width-dp configs (no emulator)
    // and diff them against committed golden PNGs. Driven by recordRoborazziWithGPlayDebug /
    // verifyRoborazziWithGPlayDebug / compareRoborazziWithGPlayDebug. See RoborazziLayoutTest.
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.64.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-junit-rule:1.64.0'
}

spotless {
    java {
        target '**/*.java'
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
    }
    format 'misc', {
        target '**/*.gradle', '**/*.md', '**/.gitignore'
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
    }
    format 'xml', {
        target '**/*.xml'
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
    }
}

// Static audit: every AppCompat AlertDialog must apply the themed card_background, otherwise it
// renders with the gray AppCompat default. See scripts/audit_dialog_backgrounds.sh. Wired into
// `check` so a new unwrapped/unmatched dialog fails the build.
tasks.register('auditDialogBackgrounds', Exec) {
    group = 'verification'
    description = 'Verify every AppCompat AlertDialog applies card_background (no gray dialogs).'
    workingDir = rootDir
    commandLine 'bash', "${rootDir}/scripts/audit_dialog_backgrounds.sh"
}
tasks.named('check') { dependsOn 'auditDialogBackgrounds' }

// `checks` — `check` with the Roborazzi screenshot goldens VERIFIED rather than merely
// captured. Plain `check`/`test` run the screenshot tests in compare-only mode, so a golden
// mismatch does not fail the build; this task hands the unit-test JVMs the same
// `roborazzi.test.verify` system property that `-Proborazzi.test.verify=true` sets, so a
// mismatch fails. Equivalent to `./gradlew :app:check -Proborazzi.test.verify=true`, but done
// as check + a guarded property rather than a nested `./gradlew`, so the whole run stays a
// single invocation. The guard keys off the requested task, so running `check` on its own
// keeps its non-gating behaviour.
tasks.register('checks') {
    group = 'verification'
    description = 'Runs check with Roborazzi screenshot verification (fails on golden mismatch).'
    dependsOn 'check'
}
if (gradle.startParameter.taskNames.any { it == 'checks' || it.endsWith(':checks') }) {
    tasks.withType(Test).configureEach {
        systemProperty 'roborazzi.test.verify', 'true'
    }
}

// Custom APK/AAB names, reimplemented on AGP 9's new Variant API (the legacy
// applicationVariants.outputs.outputFileName / bundle rename was removed by the new DSL).
// Naming rules preserved from before: withGPlay -> "slide-<versionName>", noGPlay ->
// "slide-noGPlay-<versionName>". versionName is androidGitVersion.name(), constant across variants.
def bundleBaseNames = [:]
androidComponents {
    onVariants(selector().all()) { variant ->
        def flavor = variant.flavorName
        def baseName = (flavor != null && flavor.contains("withGPlay"))
            ? "slide-${android.defaultConfig.versionName}".toString()
            : "slide-${flavor}-${android.defaultConfig.versionName}".toString()
        bundleBaseNames[variant.name] = baseName

        // Rename the APK (Slide ships a single universal APK per variant; no ABI splits).
        def renameProvider = tasks.register("rename${variant.name.capitalize()}Apks", RenameApksTask) {
            it.baseName.set(baseName)
        }
        def request = variant.artifacts.use(renameProvider)
            .wiredWithDirectories(
                { it.getApkFolder() } as kotlin.jvm.functions.Function1,
                { it.getOutFolder() } as kotlin.jvm.functions.Function1)
            .toTransformMany(SingleArtifact.APK.INSTANCE)
        renameProvider.configure { it.transformationRequest.set(request) }
    }
}

// Rename the AAB bundle. Done in a late afterEvaluate (not inside androidComponents) so this set
// runs after AGP's own configuration and wins; the target is built from AGP's stable bundle output
// dir rather than reading finalBundleFile.get(), which has no value this early under AGP 9.
project.afterEvaluate {
    bundleBaseNames.each { variantName, baseName ->
        def taskName = "sign${variantName.capitalize()}Bundle"
        if (tasks.names.contains(taskName)) {
            tasks.named(taskName, FinalizeBundleTask).configure { task ->
                task.finalBundleFile.set(
                    layout.buildDirectory.file("outputs/bundle/${variantName}/${baseName}.aab"))
            }
        }
    }
}

interface CopyApkParameters extends WorkParameters, Serializable {
    RegularFileProperty getInputApkFile()
    RegularFileProperty getOutputApkFile()
}

abstract class CopyApkWorkAction implements WorkAction<CopyApkParameters> {
    @Override
    void execute() {
        def output = parameters.outputApkFile.get().asFile
        output.delete()
        java.nio.file.Files.copy(parameters.inputApkFile.get().asFile.toPath(), output.toPath())
    }
}

abstract class RenameApksTask extends DefaultTask {
    @Input
    abstract Property<String> getBaseName()

    @InputFiles
    abstract DirectoryProperty getApkFolder()

    @OutputDirectory
    abstract DirectoryProperty getOutFolder()

    @Internal
    abstract Property<ArtifactTransformationRequest<RenameApksTask>> getTransformationRequest()

    private final WorkerExecutor workerExecutor

    @Inject
    RenameApksTask(WorkerExecutor workerExecutor) {
        this.workerExecutor = workerExecutor
    }

    @TaskAction
    void taskAction() {
        // Wipe stale APKs from previous builds so an old versionName file (e.g. slide-7.7.8.apk)
        // doesn't linger beside the current one (slide-7.7.9.apk). versionName is git-derived, so
        // the filename changes every release and the leftovers would otherwise accumulate here and
        // get swept up by the GitHub release upload's "*.apk" glob.
        outFolder.get().asFile.listFiles(
            { File f -> f.name.endsWith(".apk") } as java.io.FileFilter)?.each { it.delete() }

        transformationRequest.get().submit(
            this,
            workerExecutor.noIsolation(),
            CopyApkWorkAction.class,
            { BuiltArtifact builtArtifact, Directory outputLocation, CopyApkParameters params ->
                def newName = "${baseName.get()}.apk"
                params.inputApkFile.set(new File(builtArtifact.outputFile))
                params.outputApkFile.set(new File(outputLocation.asFile, newName as String))
                return params.outputApkFile.get().asFile
            } as kotlin.jvm.functions.Function3
        )
    }
}

